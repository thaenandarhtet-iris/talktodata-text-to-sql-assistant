test_cases:
  - id: lookup_01
    category: lookup
    question: "How many flights are in the database?"
    gold_sql: "SELECT COUNT(*) AS cnt FROM flights"
    expected_result:
      - {cnt: 4000}

  - id: lookup_02
    category: lookup
    question: "List all carrier names"
    gold_sql: "SELECT carrier_name FROM carriers ORDER BY carrier_name"
    expected_result:
      - {carrier_name: "AeroLoop"}
      - {carrier_name: "Horizon Skyways"}
      - {carrier_name: "Meridian Air"}
      - {carrier_name: "Northfield Air"}
      - {carrier_name: "Pacific Wingline"}
      - {carrier_name: "Skyline Express"}

  - id: lookup_03
    category: lookup
    question: "How many passengers are in the database?"
    gold_sql: "SELECT COUNT(*) AS cnt FROM passengers"
    expected_result:
      - {cnt: 2500}

  - id: lookup_04
    category: lookup
    question: "How many bookings exist?"
    gold_sql: "SELECT COUNT(*) AS cnt FROM bookings"
    expected_result:
      - {cnt: 11583}

  - id: lookup_05
    category: lookup
    question: "How many airports are there?"
    gold_sql: "SELECT COUNT(*) AS cnt FROM airports"
    expected_result:
      - {cnt: 20}

  - id: filter_01
    category: filter
    question: "How many flights were delayed?"
    gold_sql: "SELECT COUNT(*) AS cnt FROM flights WHERE status_cd = 'DL'"
